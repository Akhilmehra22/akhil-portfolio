[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Clean path for the fit-assessor call — proxies to the serverless
# function below. Must come before the SPA catch-all.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
